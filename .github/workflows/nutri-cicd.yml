name: NutriPredict CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # pandas, scikit-learn, mlflow, pytest, streamlit
      - name: Run Unit Tests
        run: pytest tests/ -v  # Validates ingestion/PCA/ML
      - name: Run Drift Monitor
        run: python monitor_drift.py  # Checks accuracy

  retrain-deploy:
    needs: ci-test  # Only if CI passes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'data')  # Trigger on data pushes
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      - name: Install deps
        run: pip install -r requirements.txt mlflow
      - name: Retrain Model
        env:
          MLFLOW_TRACKING_URI: ./mlruns  # Local for Actions
        run: python retrain_model.py
      - name: Deploy to Streamlit (Test)
        run: streamlit run app.py --server.port 8501 --server.headless true  # Mock deploy
      - name: Log Success
        run: echo "✅ Pipeline complete: Model retrained & deployed!"

# requirements.txt content (add to repo):
# pandas==2.0.3
# scikit-learn==1.3.0
# mlflow==2.4.2
# streamlit==1.25.0
# pytest==7.4.0